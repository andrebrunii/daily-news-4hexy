name: "🧭 Meridiano 20:05 — Radar Orario & Top 10 Giornaliera (CET)"

on:
  schedule:
    # 4 trigger sfalsati su minuti fuori-picco ogni ora per evitare il throttling di GitHub Actions.
    # Lo script Python deduplica automaticamente se lo slot dell'ora è già stato completato,
    # e recupera con commit separati eventuali ore saltate da GitHub!
    - cron: "7 * * * *"
    - cron: "23 * * * *"
    - cron: "38 * * * *"
    - cron: "53 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modalità di esecuzione (auto, hourly, daily-top10, bootstrap)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - hourly
          - daily-top10
          - bootstrap

permissions:
  contents: write

concurrency:
  group: hourly-news-updater
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Git Author (Privacy-Safe GitHub Contributions)
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Run News Radar, Catch-Up & Commit Per Slot
        env:
          TZ: "Europe/Rome"
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          python scripts/news_engine.py --mode "$MODE" --git-commit

      - name: Push Commits to GitHub
        env:
          TZ: "Europe/Rome"
        run: |
          LOCAL_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse "origin/${{ github.ref_name }}")
          if [ "$LOCAL_SHA" = "$REMOTE_SHA" ]; then
            echo "Nessun nuovo commit da inviare (slot dell'ora già completato)."
          else
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi
