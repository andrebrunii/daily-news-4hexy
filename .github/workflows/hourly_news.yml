name: "🧭 Meridiano 20:05 — Radar Orario & Top 10 Giornaliera (CET)"

on:
  schedule:
    # 4 trigger sfalsati ogni ora + Keeper Loop multi-ora per azzerare i buchi di GitHub Actions
    - cron: "5 * * * *"
    - cron: "20 * * * *"
    - cron: "35 * * * *"
    - cron: "50 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modalità di esecuzione (auto, hourly, daily-top10, bootstrap)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - hourly
          - daily-top10
          - bootstrap

permissions:
  contents: write

concurrency:
  group: hourly-news-updater
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure Git Author (Privacy-Safe GitHub Contributions)
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

      - name: Run News Radar, Catch-Up & 5-Hour Real-Time Keeper
        env:
          TZ: "Europe/Rome"
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          BRANCH="${{ github.ref_name }}"

          sync_and_push() {
            git pull --rebase origin "$BRANCH" || true
            python scripts/news_engine.py --mode "$1" --git-commit
            LOCAL_SHA=$(git rev-parse HEAD)
            REMOTE_SHA=$(git rev-parse "origin/$BRANCH")
            if [ "$LOCAL_SHA" != "$REMOTE_SHA" ]; then
              git pull --rebase origin "$BRANCH" || true
              git push origin HEAD:"$BRANCH"
              echo "[PUSH] Aggiornamento inviato su origin/$BRANCH alle $(date '+%Y-%m-%d %H:%M:%S %Z')"
            else
              echo "[OK] Nessun nuovo commit da inviare alle $(date '+%Y-%m-%d %H:%M:%S %Z')"
            fi
          }

          # 1. Esecuzione immediata (recupera subito eventuali ore arretrate + slot corrente)
          sync_and_push "$MODE"

          # Se è stato richiesto un mode manuale specifico diverso da auto, termina subito
          if [ "$MODE" != "auto" ]; then
            exit 0
          fi

          # 2. Multi-Hour Real-Time Keeper (copre fino a 5 ore consecutive al minuto esatto :05 CET
          #    così anche se lo scheduler cron di GitHub ritarda di 5 ore, non si ferma mai!)
          for CYCLE in 1 2 3 4 5; do
            SLEEP_SECS=$(python -c "import datetime as dt; from zoneinfo import ZoneInfo; now=dt.datetime.now(ZoneInfo('Europe/Rome')); target=now.replace(minute=5, second=8, microsecond=0); target = target + dt.timedelta(hours=1) if target <= now else target; print(max(15, int((target - now).total_seconds())))")
            echo "[KEEPER $CYCLE/5] In attesa di ${SLEEP_SECS}s fino al prossimo slot delle :05 CET..."
            sleep "$SLEEP_SECS"
            sync_and_push "auto"
          done
