name: "🧭 Meridiano 20:05 — Radar Orario & Top 10 Giornaliera (CET)"

on:
  schedule:
    # Gira al minuto :05 di ogni ora (24 volte al giorno = 23 ricerche orarie + Top 10 alle 20:05 CET)
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modalità di esecuzione (auto, hourly, daily-top10, bootstrap)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - hourly
          - daily-top10
          - bootstrap

permissions:
  contents: write

concurrency:
  group: hourly-news-updater
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run News Radar & Top 10 Engine
        env:
          TZ: "Europe/Rome"
        run: |
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          python scripts/news_engine.py --mode "$MODE"

      - name: Commit and Push Updates (Privacy-Safe GitHub Contributions)
        env:
          TZ: "Europe/Rome"
        run: |
          # Usa l'indirizzo noreply ufficiale di GitHub collegato all'account:
          # zero dati personali/email private esposte, ma 100% valido per le GitHub Contributions!
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

          git add README.md IN_CORSO.md archivio/ data/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
          else
            NOW_STR=$(date +'%Y-%m-%d %H:%M CET')
            HOUR_NOW=$(date +'%H')
            if [ "$HOUR_NOW" = "20" ]; then
              COMMIT_MSG="🏆 Top 10 Giornaliera & Edizione Completa ($NOW_STR)"
            else
              COMMIT_MSG="📡 Ricerca Oraria #$HOUR_NOW:05 ($NOW_STR)"
            fi
            git commit -m "$COMMIT_MSG"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin HEAD:"${{ github.ref_name }}"
          fi
